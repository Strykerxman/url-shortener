services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      BASE_URL: ${BASE_URL:-http://127.0.0.1:8000}
      ENV_NAME: docker
      DEBUG: ${DEBUG:-false}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    # NOTE: alembic upgrade is not automatic on startup.
    # REASON: Schema changes in production should be explicit, tested, and not tied to deployment.
    # For your first deployment, run migrations manually after bringing up the stack:
    #   docker compose exec server alembic upgrade head
    # For subsequent deployments, consider a separate migration service or helm hooks.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: urlshortener_db
      POSTGRES_INITDB_ARGS: "-c max_connections=20"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "${REDIS_PORT:-6379}"]
    environment:
      REDIS_PORT: ${REDIS_PORT:-6379}
    # Uncomment to expose Redis to the host:
    # ports:
    #   - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge